services:
  kafka-1:
    image: apache/kafka:4.0.0
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9097:9096" # SECURED for Applications
    volumes:
      - kafka1-data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/tmp/kafka_server_jaas.conf
    environment:
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'Qqz3-CYHTt-Vwdr02bSjOw'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_LISTENERS: 'BROKER://kafka-1:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-1:9093,EXTERNAL_SECURE://0.0.0.0:9096'
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-1:29092,EXTERNAL://localhost:9092,EXTERNAL_SECURE://localhost:9097'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL_SECURE:SASL_PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'BROKER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_UNSTABLE_API_VERSIONS_ENABLE: 'true'
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: 'classic,consumer,share'
      KAFKA_SASL_ENABLED_MECHANISMS: 'SCRAM-SHA-256'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: 'SCRAM-SHA-256'
      KAFKA_OPTS: "-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"

  kafka-2:
    image: apache/kafka:4.0.0
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "9094:9092"
      - "9098:9096"
    volumes:
      - kafka2-data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/tmp/kafka_server_jaas.conf
    depends_on:
      - kafka-1
    environment:
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_NODE_ID: 2
      CLUSTER_ID: 'Qqz3-CYHTt-Vwdr02bSjOw'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_LISTENERS: 'BROKER://kafka-2:29092,EXTERNAL://0.0.0.0:9092,EXTERNAL_SECURE://0.0.0.0:9096'
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-2:29092,EXTERNAL://localhost:9094,EXTERNAL_SECURE://localhost:9098'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL_SECURE:SASL_PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'BROKER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_UNSTABLE_API_VERSIONS_ENABLE: 'true'
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: 'classic,consumer,share'
      KAFKA_SASL_ENABLED_MECHANISMS: 'SCRAM-SHA-256'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: 'SCRAM-SHA-256'
      KAFKA_OPTS: "-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"

  kafka-3:
    image: apache/kafka:4.0.0
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "9095:9092"
      - "9099:9096"
    volumes:
      - kafka3-data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/tmp/kafka_server_jaas.conf
    depends_on:
      - kafka-1
    environment:
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_NODE_ID: 3
      CLUSTER_ID: 'Qqz3-CYHTt-Vwdr02bSjOw'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_LISTENERS: 'BROKER://kafka-3:29092,EXTERNAL://0.0.0.0:9092,EXTERNAL_SECURE://0.0.0.0:9096'
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-3:29092,EXTERNAL://localhost:9095,EXTERNAL_SECURE://localhost:9099'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL_SECURE:SASL_PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'BROKER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_UNSTABLE_API_VERSIONS_ENABLE: 'true'
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: 'classic,consumer,share'
      KAFKA_SASL_ENABLED_MECHANISMS: 'SCRAM-SHA-256'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: 'SCRAM-SHA-256'
      KAFKA_OPTS: "-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"

  kafka-4:
    image: apache/kafka:4.0.0
    hostname: kafka-4
    container_name: kafka-4
    ports:
      - "9096:9092"
      - "9100:9096"
    volumes:
      - kafka4-data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/tmp/kafka_server_jaas.conf
    depends_on:
      - kafka-1
    environment:
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_NODE_ID: 4
      CLUSTER_ID: 'Qqz3-CYHTt-Vwdr02bSjOw'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_LISTENERS: 'BROKER://kafka-4:29092,EXTERNAL://0.0.0.0:9092,EXTERNAL_SECURE://0.0.0.0:9096'
      KAFKA_ADVERTISED_LISTENERS: 'BROKER://kafka-4:29092,EXTERNAL://localhost:9096,EXTERNAL_SECURE://localhost:9100'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL_SECURE:SASL_PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'BROKER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_UNSTABLE_API_VERSIONS_ENABLE: 'true'
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: 'classic,consumer,share'
      KAFKA_SASL_ENABLED_MECHANISMS: 'SCRAM-SHA-256'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: 'SCRAM-SHA-256'
      KAFKA_OPTS: "-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-1:29092,kafka-2:29092,kafka-3:29092'

  # Additional Service for Kafka Connect in distributed mode
  connect-distributed:
    image: apache/kafka:4.0.0
    hostname: connect-distributed
    container_name: connect-distributed
    command: >
      /bin/bash -c "/opt/kafka/bin/connect-distributed.sh /tmp/connect-distributed.properties"
    ports:
      - "8083:8083"
    volumes:
      - ./connect-distributed.properties:/tmp/connect-distributed.properties
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - schema-registry
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'multi-node-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-1:29092,kafka-2:29092,kafka-3:29092'
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: 'http://schema-registry:8081'

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  kafka4-data:
